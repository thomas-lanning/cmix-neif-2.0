name: Fit and screen quantized weights from a verified full-corpus training set
on:
  workflow_run:
    workflows: [Rebuild the late quantization benchmark from the complete corpus]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      training: ${{ steps.find.outputs.training }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq 'any(.artifacts[]; .name=="full-corpus-training" and (.expired|not))')
          echo "training=$found" >>"$GITHUB_OUTPUT"
  fit:
    needs: fixture
    if: needs.fixture.outputs.training == 'true'
    uses: ./.github/workflows/qat-checkpoint.yml
    with:
      corpus_training_run: ${{ format('{0}', github.event.workflow_run.id) }}
      fixture_run: '44248300047'
      token_gradients: true
  validate:
    needs: fit
    uses: ./.github/workflows/validate-exports.yml
    with:
      fixture_run: '44248300047'
      exports_run: ${{ format('{0}', github.run_id) }}
      artifact_name: supervised-symbol-trial
  choose:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      model: ${{ steps.rank.outputs.model }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: independent-quantization-results
          path: scores
      - id: rank
        run: |
          best=$(jq -r '[.outcomes[] | select(.projected_entry_delta_bytes < 0)] | sort_by(.projected_entry_delta_bytes, .candidate_sha256) | .[0].candidate_sha256 // empty' scores/summary.json)
          echo "model=$best" >>"$GITHUB_OUTPUT"
  payload:
    needs: choose
    if: needs.choose.outputs.model != ''
    uses: ./.github/workflows/quant-payload.yml
    with:
      exports_run: ${{ format('{0}', github.run_id) }}
      validation_run: ${{ format('{0}', github.run_id) }}
      artifact: supervised-symbol-trial
      candidate_sha256: ${{ needs.choose.outputs.model }}
  larger:
    needs: [choose, payload]
    if: needs.payload.outputs.advance == 'true'
    uses: ./.github/workflows/large-prefix.yml
    with:
      candidate_sha256: ${{ needs.choose.outputs.model }}
  later_articles:
    needs: choose
    if: needs.choose.outputs.model != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: supervised-symbol-trial
          path: ${{ runner.temp }}/exports
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: late-article-benchmark
          path: ${{ runner.temp }}/late
      - name: Replay the frozen model on 96 later articles excluded from training
        env:
          MODEL: ${{ needs.choose.outputs.model }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/late"
          tar -xzf "$d/late-enwik9-benchmark.tar.gz" -C "$d" ./sealed96
          echo "4aaae03b731808a4cb09524a4f759cf120648a1d3549a160f7dd3a40bce4d85d  $d/sealed96/manifest.json" | sha256sum -c -
          python3 -m venv "$d/env"; "$d/env/bin/pip" install --quiet numpy==2.2.6
          research/quant/build.sh "$d/replay"
          weight=$(python3 - "$RUNNER_TEMP/exports" "$MODEL" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys
          print(next(p for p in Path(sys.argv[1]).rglob('*.c5') if sha256(p.read_bytes()).hexdigest() == sys.argv[2]))
          PY
          )
          "$d/env/bin/python" research/quant/evaluate.py "$d/replay" "$d/sealed96" "$weight" "$d/results" --label late96
          alpha=$(jq -er .ranking_transfer research/quant/prefix-calibration.json)
          "$d/env/bin/python" research/quant/paired_stats.py --transfer "$alpha" "$d/results/trials.jsonl" "$d/sealed96/manifest.json" >"$d/results/summary.json"
          jq '{documents, targets, improved_documents, weight_delta_both_copies, projected_entry_delta_bytes}' "$d/results/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-model-on-96-later-articles
          path: |
            ${{ runner.temp }}/late/results/trials.jsonl
            ${{ runner.temp }}/late/results/summary.json
          retention-days: 30
