name: Recover and verify the trainable checkpoint on CPU
on:
  workflow_dispatch:
    inputs:
      fit_rows:
        description: Fit row sensitivities using CPU reference kernels and run native replay
        type: boolean
        default: false
      fixture_run:
        description: Run containing the portable-c40 artifact
        type: string
      profile_run:
        description: Run containing the quantized-head native profiles
        type: string
      token_gradients:
        description: Fit individual weight codes using real target likelihood on the disjoint training suite
        type: boolean
        default: false
      training_run:
        description: Optional separate 96-article training fixture build
        type: string
      corpus_training_run:
        description: Optional completed full-corpus-training build with 1024 independent articles
        type: string
      refit_from:
        description: Optional completed cpu-fisher-trial run with frozen row choices
        type: string
  workflow_call:
    inputs:
      fixture_run: {type: string, required: true}
      training_run: {type: string, required: false}
      corpus_training_run: {type: string, required: true}
      token_gradients: {type: boolean, default: true}
permissions:
  contents: read
  actions: read
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.corpus_training_run != '' && 240 || 90 }}
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble the released trainer and its CPU conversion dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/env"
          py="$RUNNER_TEMP/env/bin/python"
          "$py" -m pip install --quiet torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install --quiet numpy==2.4.6 triton==3.7.1 flash-linear-attention==0.5.1 jaxtyping pytorch-optimizer tqdm wandb python-dotenv
          cp -a training/tf/tree_upstream "$RUNNER_TEMP/trainer"
          cp -a training/tf/tree_overlay/. "$RUNNER_TEMP/trainer/"
          "$py" training/tf/2_package/patch_paket11.py "$RUNNER_TEMP/trainer"
      - name: Recover model parameters and check the trainer's integer weights
        run: |
          set -euo pipefail
          export TFT_TREE="$RUNNER_TEMP/trainer"
          py="$RUNNER_TEMP/env/bin/python"
          out="$RUNNER_TEMP/checkpoint"
          mkdir "$out"
          # The CPU converter uses the model-form environment from the training chain.
          # It reconstructs parameters without opening training batches.
          export PKG="$out"
          source training/tf/3_train/tree/exp.env
          "$py" research/quant/qat_seed.py "$out/plain.c5" >"$out/container.json"
          echo "26e572080c240b6c8eb59a8dc8aab6ab6591efac695424f5942abf1d8fdde712  $out/plain.c5" | sha256sum -c -
          "$py" training/tf/3_train/container_to_tch.py --container "$out/plain.c5" \
            --cfg training/tf/3_train/chain/06_qat.json --strict "$out/strict.tch" \
            --qrow "$out/row-ranges.npz" --report "$out/conversion.json"
          "$py" - "$out/conversion.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1]))
          assert report["n_container_tensors"] == 597
          assert report["int_check"]["tensors"] > 100 and report["int_check"]["mismatch"] == 0
          print(report["int_check"])
          PY
          (cd "$out" && sha256sum strict.tch row-ranges.npz > files.sha256)
          "$py" -m pip freeze > "$out/environment.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: quantization-aware-start
          path: |
            ${{ runner.temp }}/checkpoint/strict.tch
            ${{ runner.temp }}/checkpoint/row-ranges.npz
            ${{ runner.temp }}/checkpoint/*.json
            ${{ runner.temp }}/checkpoint/files.sha256
            ${{ runner.temp }}/checkpoint/environment.txt
          retention-days: 30
      - uses: actions/download-artifact@v4
        if: inputs.fit_rows || inputs.refit_from != '' || inputs.token_gradients
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run }}
          name: portable-c40
          path: ${{ runner.temp }}/fixture-artifact
      - uses: actions/download-artifact@v4
        if: inputs.fit_rows
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.profile_run }}
          name: quantized-head
          path: ${{ runner.temp }}/profile-artifact
      - name: Differentiate the full quantized model and replay three exported allocations
        if: inputs.fit_rows
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fisher"; mkdir "$d"
          export TFT_TREE="$RUNNER_TEMP/trainer" PKG="$RUNNER_TEMP/checkpoint"
          source training/tf/3_train/tree/exp.env
          tar -C "$d" -xzf "$RUNNER_TEMP/fixture-artifact/c40-kit.tar.gz"
          tar -C "$d" -xzf "$RUNNER_TEMP/profile-artifact/profile.tar.gz"
          echo "77974c6afc23485b60b0a8444b3060e465fcc9ae5b65cf1c75c5a0090b29753b  $d/suite/manifest.json" | sha256sum -c -
          "$RUNNER_TEMP/env/bin/python" -u research/quant/cpu_fisher.py \
            "$RUNNER_TEMP/checkpoint" "$d/suite" "$d/profile" "$d/replay" "$d/results" | tee "$d/fit.log"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.fit_rows
        with:
          name: cpu-fisher-trial
          path: |
            ${{ runner.temp }}/fisher/fit.log
            ${{ runner.temp }}/fisher/results/
          retention-days: 30
      - uses: actions/download-artifact@v4
        if: inputs.refit_from != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.refit_from }}
          name: cpu-fisher-trial
          path: ${{ runner.temp }}/frozen-fisher
      - uses: actions/download-artifact@v4
        if: (inputs.refit_from != '' || inputs.token_gradients) && inputs.training_run != '' && inputs.corpus_training_run == ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.training_run }}
          name: training-c40
          path: ${{ runner.temp }}/training-artifact
      - uses: actions/download-artifact@v4
        if: (inputs.refit_from != '' || inputs.token_gradients) && (inputs.training_run != '' || inputs.corpus_training_run != '')
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.training_run || inputs.fixture_run }}
          name: validation-c40
          path: ${{ runner.temp }}/validation-artifact
      - uses: actions/download-artifact@v4
        if: (inputs.refit_from != '' || inputs.token_gradients) && inputs.corpus_training_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.corpus_training_run }}
          name: full-corpus-training
          path: ${{ runner.temp }}/training-artifact
      - name: Select the requested verified training package
        if: (inputs.refit_from != '' || inputs.token_gradients) && (inputs.training_run != '' || inputs.corpus_training_run != '')
        env:
          CORPUS_TRAINING_RUN: ${{ inputs.corpus_training_run }}
        run: |
          name=c40-training.tar.gz
          if [[ -n "$CORPUS_TRAINING_RUN" ]]; then name=train1024.tar.gz; fi
          archive="$RUNNER_TEMP/training-artifact/$name"
          test -s "$archive"
          echo "TRAINING_ARCHIVE=$archive" >>"$GITHUB_ENV"
      - name: Train discrete row weights and scales through the full CPU model
        if: inputs.refit_from != ''
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/qat-rows"; mkdir "$d"
          export TFT_TREE="$RUNNER_TEMP/trainer" PKG="$RUNNER_TEMP/checkpoint"
          source training/tf/3_train/tree/exp.env
          tar -C "$d" -xzf "$RUNNER_TEMP/fixture-artifact/c40-kit.tar.gz"
          echo "77974c6afc23485b60b0a8444b3060e465fcc9ae5b65cf1c75c5a0090b29753b  $d/suite/manifest.json" | sha256sum -c -
          options=()
          if [[ -d "$RUNNER_TEMP/training-artifact" ]]; then
            tar -C "$d" -xzf "$TRAINING_ARCHIVE"
            tar -xzOf "$RUNNER_TEMP/validation-artifact/c40-validation.tar.gz" ./suite/manifest.json >"$d/validation-manifest.json"
            options=(--training-suite "$d/training" --validation-manifest "$d/validation-manifest.json" --steps 192)
          fi
          "$RUNNER_TEMP/env/bin/python" -u research/quant/qat_rows.py "$RUNNER_TEMP/checkpoint" \
            "$RUNNER_TEMP/frozen-fisher/results/ranking.json" "$d/suite" "$d/replay" "$d/results" "${options[@]}" | tee "$d/fit.log"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.refit_from != ''
        with:
          name: full-model-qat-trial
          path: |
            ${{ runner.temp }}/qat-rows/fit.log
            ${{ runner.temp }}/qat-rows/results/
          retention-days: 30
      - name: Fit lower-rate weight codes using held-separate training articles
        if: inputs.token_gradients
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/symbol-gradients"; mkdir "$d"
          export TFT_TREE="$RUNNER_TEMP/trainer" PKG="$RUNNER_TEMP/checkpoint"
          source training/tf/3_train/tree/exp.env
          tar -C "$d" -xzf "$RUNNER_TEMP/fixture-artifact/c40-kit.tar.gz"
          tar -C "$d" -xzf "$TRAINING_ARCHIVE"
          tar -xzOf "$RUNNER_TEMP/validation-artifact/c40-validation.tar.gz" ./suite/manifest.json >"$d/validation-manifest.json"
          "$RUNNER_TEMP/env/bin/python" -u research/quant/symbol_gradients.py \
            "$RUNNER_TEMP/checkpoint" "$d/suite" "$d/training" "$d/validation-manifest.json" "$d/replay" "$d/results" | tee "$d/fit.log"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.token_gradients
        with:
          name: supervised-symbol-trial
          path: |
            ${{ runner.temp }}/symbol-gradients/fit.log
            ${{ runner.temp }}/symbol-gradients/results/
          retention-days: 30
