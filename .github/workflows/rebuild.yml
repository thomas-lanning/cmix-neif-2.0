name: Rebuild published compressor
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build in Ubuntu 24.04 with the upstream package recipe
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          docker run --rm -v "$PWD:/source:ro" -v "$RUNNER_TEMP/reference:/result" ubuntu:24.04 bash -ec '
            bash /source/install.sh > /result/install.log 2>&1 || { tail -80 /result/install.log; exit 1; }
            chown 65534:65534 /result
            cd /result
            su -s /bin/bash nobody -c "bash /source/build.sh" > build.log 2>&1 || { tail -80 build.log; exit 1; }
            sha256sum comp9 | tee comp9.sha256
            echo "976bf2d309707ab555e0c92720da5508ff0e5e6b846fc7082234262b06767f82  comp9" | sha256sum -c -
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-rebuild
          path: ${{ runner.temp }}/reference/*
          retention-days: 7
