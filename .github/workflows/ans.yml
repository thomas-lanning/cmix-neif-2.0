name: Compare rANS against published arithmetic stream
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build capture and replay first 131072 coded decisions
        run: |
          dest="$RUNNER_TEMP/ans"
          mkdir "$dest"
          cp -r src makefile encoder_split.lds runtime_exports.map "$dest/"
          python3 research/ans/probe.py instrument "$dest"
          make -C "$dest" -j4 cmix CC=clang++-18 >"$dest/build.log" 2>&1 || { tail -60 "$dest/build.log"; exit 1; }
          cp weights-*.c5 "$dest/"
          cd "$dest"
          curl -fLsS --retry 3 https://marwoelk.de/cmix-neif-2.0/archive9 -o published.archive9
          python3 "$GITHUB_WORKSPACE/research/ans/probe.py" payload published.archive9
          ./cmix -d published.payload output >capture.log 2>&1 || { tail -c 1800 capture.log; exit 1; }
          test "$(stat -c%s coded-events.bin)" = 655360
          python3 "$GITHUB_WORKSPACE/research/ans/compare.py" coded-events.bin --original-payload published.payload | tee results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ans-prefix
          path: |
            ${{ runner.temp }}/ans/coded-events.bin
            ${{ runner.temp }}/ans/results.jsonl
