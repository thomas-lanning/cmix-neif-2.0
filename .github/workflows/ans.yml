name: Compare rANS against published arithmetic stream
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build capture and replay first 131072 coded decisions
        run: |
          dest="$RUNNER_TEMP/ans"
          mkdir "$dest"
          cp -r src makefile encoder_split.lds runtime_exports.map pgo_data "$dest/"
          python3 research/ans/probe.py instrument "$dest"
          make -C "$dest" -j4 prof_use CC=clang++-18 >"$dest/build.log" 2>&1 || { tail -60 "$dest/build.log"; exit 1; }
          cp weights-*.c5 "$dest/"
          cd "$dest"
          curl -fLsS --retry 3 https://marwoelk.de/cmix-neif-2.0/archive9 -o published.archive9
          python3 "$GITHUB_WORKSPACE/research/ans/probe.py" payload published.archive9
          ./cmix -d published.payload output >capture.log 2>&1 || { tail -c 1800 capture.log; exit 1; }
          test "$(stat -c%s coded-events.bin)" = 655360
          # Independent oracle captured during encoding of the original canonical
          # input, with output compared byte-for-byte to the published archive.
          echo '95f04fea97d97423fae673febe8e79edce54d87973a3b4dd8ced3be8523a62ae  coded-events.bin' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/research/ans/compare.py" coded-events.bin --original-payload published.payload | tee results.jsonl
          g++ -O3 -std=c++17 "$GITHUB_WORKSPACE/research/ans/continuous.cpp" -o continuous
          for p in 16 24 32; do ./continuous coded-events.bin "payload-$p.rans" "$p"; done | tee continuous.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ans-prefix
          path: |
            ${{ runner.temp }}/ans/coded-events.bin
            ${{ runner.temp }}/ans/results.jsonl
            ${{ runner.temp }}/ans/continuous.jsonl
